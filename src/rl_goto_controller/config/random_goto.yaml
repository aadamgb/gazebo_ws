# random_goto.py settings of the flights, used by both the HITL session (tmux/hitl/session_laptop.yaml) and the real
# flight (tmux/realworld/tmux.sh), so that Gazebo and the real UAV fly the same goal sequence:
#   ros2 run rl_goto_controller random_goto.py --ros-args \
#     --params-file `ros2 pkg prefix --share rl_goto_controller`/config/random_goto.yaml -p uav_name:=$UAV_NAME
# The goals are offsets from where the UAV hovers when the script starts; with the same seed the n-th goal has the
# same offset in both runs (logged as "goal #n ... offset [...]").
random_goto:
  ros__parameters:
    seed: 0
    # 2 x 2 m square in the plane of the start position [m]
    x_min: -1.0
    x_max: 1.0
    y_min: -1.0
    y_max: 1.0
    z_min: 0.0
    z_max: 0.0
    radius: 0.2       # [m] goal reached threshold
    timeout: 10.0     # [s] next goal if not reached
    max_distance: 3.0 # [m] beyond: RLGoto -> ActuatorsController, goals stopped

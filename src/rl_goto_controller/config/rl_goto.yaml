#========================================================================================
# ---------------------------------------------------------------------------------------
# ⚠️ Agile general policy ⚠️
# ---------------------------------------------------------------------------------------
# =======================================================================================
# NOTE: Works well for heavier drones like m690, x500, 
#       so so in a300 and crashes with robofly

mrs_uav_controllers:

  rl_goto:
    # policy: "/home/adamgb/phd/genesis_ws/logs/robust_goto/SRT_general_R7_all/model_1999_scripted.pt"
    # .rlp from utils/export_policy.py; a relative path is looked up in the policies/ of this package
    policy: "SRT_general_R5_rerand_upset.rlp"  # This one is safe with a300
    # policy: "/home/adamgb/phd/genesis_ws/logs/robust_goto/SRT_general_R4_upset/model_1700_scripted.pt"
    # policy: "/home/adamgb/phd/genesis_ws/logs/robust_goto/SRT_general_R3_rerand/model_1600_scripted.pt"
    # policy: "/home/adamgb/phd/genesis_ws/logs/robust_goto/SRT_general_R1_B64k/model_1999_scripted.pt"
    # policy: "/home/adamgb/phd/genesis_ws/logs/robust_goto/SRT_general_R05_whoop/model_1800_scripted.pt"
    # policy: "/home/adamgb/phd/data/policies/camp_october_2026/srt_general_super_agile.pt"

    # must match the genesis env: policy_rate = 1 / env.dt
    policy_rate: 125.0 # [Hz]
    obs_history: 4     # frames stacked in the observation, genesis obs.history
    hover_cmd: 0.0  # -
    action_scale: 0.0  # -
    hover_center_throttle: false
    adapt_encoder: true

    #========================
    #     robofly
    #========================
    drone:
      mass: 0.82                            # [kg]
      inertia: [0.00837, 0.00837, 0.01638]  # [kg m^2] Jxx, Jyy, Jzz
      arm: 0.135                            # [m] rotor distance from the COM
      kf: 7.347372e-8                       # [N/rpm^2]
      max_rpm: 21963.382                    # [rpm]
      motor_tau: [0.0125, 0.025]            # [s] up, down
      motor_eff: [1.0, 1.0, 1.0, 1.0]       # [-]
      action_delay: 0.018                   # [s] odometry -> motors latency


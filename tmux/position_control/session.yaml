# do not modify these
root: ./
name: simulation
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
pre_window:
  - export UAV_NAME=uav1
  - export RUN_TYPE=simulation
  - export UAV_TYPE=a300
  - export PLATFORM_CONFIG=`ros2 pkg prefix alien_gazebo_resources`/share/alien_gazebo_resources/config/mrs_uav_system/$UAV_TYPE.yaml
  - export GZ_SIM_RESOURCE_PATH=`ros2 pkg prefix alien_gazebo_resources`/share/alien_gazebo_resources/models:$GZ_SIM_RESOURCE_PATH
  - export RMW_IMPLEMENTATION=rmw_zenoh_cpp
  - export USE_SIM_TIME="true"
  - export QT_QUICK_CONTROLS_STYLE=Material # Gazebo dark mode
startup_window: core
windows:
  - zenoh_router:
      layout: tiled
      panes:
        - ros2 run rmw_zenoh_cpp rmw_zenohd
  - gazebo:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_gazebo_simulator simulation.launch.py
          world_file:=`ros2 pkg prefix alien_gazebo_resources`/share/alien_gazebo_resources/worlds/checkerboard.sdf
          spawner_config:=./config/spawner_config.yaml
          gz_headless:=false gz_verbose:=true       
        - |
          waitForGazebo; sleep 5; ros2 service call /mrs_drone_spawner/spawn mrs_msgs/srv/String "{value: '1 --$UAV_TYPE --enable-rangefinder --enable-ground-truth --pos 0 0 0.25 0.0'}"
  - px4_api:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_px4_api api.launch.py
  - core:
      layout: tiled
      panes:
        - waitForHwApi; ros2 launch mrs_uav_core core.launch.py
          platform_config:=$PLATFORM_CONFIG
          world_config:=./config/world_config.yaml
          custom_config:=./config/custom_config.yaml
          network_config:=./config/network_config.yaml
  - status:
      layout: tiled
      panes:
        - ros2 run mrs_uav_status status.sh
  - random_goto:
      layout: tiled
      panes:
        - waitForCore; ./random_goto.py
  - autostart:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_autostart automatic_start.launch.py custom_config:=./config/automatic_start.yaml
        - waitForCore; sleep 10; ./takeoff.sh
  - rviz:
      layout: tiled
      panes:
        - waitForCore; ros2 run rviz2 rviz2 -d ./rviz.rviz --ros-args -p use_sim_time:=true
  # - plotjuggler:
  #     layout: tiled
  #     panes:
  #       - waitForCore; ros2 run plotjuggler plotjuggler --ros-args -p use_sim_time:=true
  - layout:
      layout: tiled
      panes:
        - waitForCore; ~/.config/hypr/scripts/mrs_layout.sh

# Real-world copy of ../../hitl/config/custom_config.yaml, with the MRS safety measures back on.
#
# Layered safety, from the first to trigger:
#   1. random_goto.py: UAV > 3 m from its goal box   -> switches RLGoto to ActuatorsController, stops the goals
#   2. control_manager: position error > eland_threshold (3.5 m, w.r.t. the tracker reference), tilt > 75 deg,
#      tilt error > 20 deg for 0.5 s, yaw error > 90 deg
#      -> with rc_emergency_handoff the control goes back to the safety pilot's RC
#   3. the safety pilot (RC mode switch / kill switch)
#
# Rehearse with these values in HITL before flying: if a safety measure triggers during normal RLGoto flight
# there, the limit is too tight for the policy.

# GET ALL PARAMETERS USABLE FOR CUSTOM CONFIG BY RUNNING:
## --------------------------------------------------------------
## |          rosrun mrs_uav_core get_public_params.py          #
## --------------------------------------------------------------

mrs_uav_managers:

  estimation_manager:

    # loaded state estimator plugins
    # gps_garmin / gps_baro are fallbacks, the actuator controllers need passthrough (>= 225 Hz hw_api/odometry:
    # PX4 EKF2_PREDICT_US 4000, IMU_INTEG_RATE >= 250, LOCAL_POSITION_NED + ODOMETRY streamed at 250 Hz)
    state_estimators: [
      "passthrough",
      "gps_garmin",
      "gps_baro",
    ]

    initial_state_estimator: "passthrough" # will be used as the first state estimator
    agl_height_estimator: "garmin_agl" # only slightly filtered height for checking min height (not used in control feedback)

  control_manager:

    # The following safety features should be carefully adjusted by the operator depending on the experimental conditions and setup
    safety:

      # Disables safety measures that would "bring the UAV to the ground" (emergancy landing, failsafe landing, disarm)
      # * true => any safety measure that would othewise lead to the ground will result in giving control back to the safety pilot's RC controller
      # * false => the system will automatically eland, failsafe leanding or disarm to minimize damage during malfunction
      rc_emergency_handoff:
        enabled: true

      # The escalating safety measure that occurs when pressing the RC emergency button.
      escalating_failsafe:

        # 1st press: the emergency hover is triggered (the user's input into the system is ignored, EmergencyController is activated)
        ehover: true
        # 2nd press: the emergency landing is triggered
        eland: true
        # 3rd press: the feedforward failsafe landing is triggered (semi-controlled fall)
        failsafe: false

      # safety measures that trigger when the absolute tilt is larger than certain threshold
      tilt_limit:

        eland:
          enabled: true
          limit: 75.0 # [deg]

        disarm:
          enabled: true
          limit: 90.0 # [deg]

      # disarming safety measure which triggers with large tilt (orientation) error that is sustained over the set timeout threshold
      tilt_error_disarm:
        enabled: true
        timeout: 0.5 # [s] # for how long the error has to be present to disarm
        error_threshold: 20.0 # [deg]

      # safety measures that trigger when yaw control error grows over pre-set threshold
      yaw_error_eland:
        enabled: true
        limit: 90.0 # [deg]

    # eland_threshold: position error w.r.t. the tracker reference [m]; RLGoto does not follow the tracker, but its
    # goals stay within random_goto's box around the hover point where the tracker reference was left
    ActuatorsController:
      address: "srt_controller::ActuatorsController"
      namespace: "actuators_controller"
      eland_threshold: 3.5 # [m]
      failsafe_threshold: 0.0 # [m]
      odometry_innovation_threshold: 0.0 # [m]
      human_switchable: true

      outputs:
        actuators:             true
        control_group:         false
        attitude_rate:         false
        attitude:              false
        acceleration_hdg_rate: false
        acceleration_hdg:      false
        velocity_hdg_rate:     false
        velocity_hdg:          false
        position:              false

    RLGoto:
      address: "rl_goto_controller::RLGoto"
      namespace: "rl_goto"
      eland_threshold: 3.5 # [m]
      failsafe_threshold: 0.0 # [m]
      odometry_innovation_threshold: 0.0 # [m]
      human_switchable: true

      outputs:
        actuators:             true
        control_group:         false
        attitude_rate:         false
        attitude:              false
        acceleration_hdg_rate: false
        acceleration_hdg:      false
        velocity_hdg_rate:     false
        velocity_hdg:          false
        position:              false

    controllers : [
      "ActuatorsController",
      "RLGoto"
    ]

  uav_manager:

    takeoff:

      # must lie inside the vertical safety area of world_$WORLD_NAME.yaml
      takeoff_height: 2.5

      during_takeoff:
        controller: "MpcController"
        tracker: "LandoffTracker"

      # safe hover after takeoff; then switch manually (windows Actuators -> RLGoto of tmux.sh)
      after_takeoff:
        controller: "MpcController"
        tracker: "MpcTracker"

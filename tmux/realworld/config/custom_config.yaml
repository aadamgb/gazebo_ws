# Real-world copy of ../../hitl/config/custom_config.yaml, with the MRS safety measures back on.
#
# Layered safety, from the first to trigger:
#   1. random_goto.py: UAV > 3 m from its goal box   -> switches RLGoto to ActuatorsController, stops the goals
#   2. control_manager: position error > eland_threshold (3.5 m, w.r.t. the tracker reference), tilt > 75 deg,
#      tilt error > 20 deg for 0.5 s, yaw error > 90 deg
#      -> with rc_emergency_handoff the control goes back to the safety pilot's RC
#   3. the safety pilot (RC mode switch / kill switch)
#
# Rehearse with these values in HITL before flying: if a safety measure triggers during normal RLGoto flight
# there, the limit is too tight for the policy.

# GET ALL PARAMETERS USABLE FOR CUSTOM CONFIG BY RUNNING:
## --------------------------------------------------------------
## |          rosrun mrs_uav_core get_public_params.py          #
## --------------------------------------------------------------

mrs_uav_managers:

  estimation_manager:

    # loaded state estimator plugins
    # gps_baro is the fallback, the actuator controllers need passthrough (>= 225 Hz hw_api/odometry:
    # PX4 EKF2_PREDICT_US 4000, IMU_INTEG_RATE >= 250, LOCAL_POSITION_NED + ODOMETRY at -r 500);
    # no gps_garmin: uav58 has no rangefinder
    state_estimators: [
      "passthrough",
      "f9p",
    ]

    initial_state_estimator: "passthrough" # will be used as the first state estimator
    agl_height_estimator: "" # only slightly filtered height for checking min height (not used in control feedback)

  control_manager:

    # The following safety features should be carefully adjusted by the operator depending on the experimental conditions and setup
    safety:
      rc_emergency_handoff:
        enabled: true
      tilt_limit:
        eland:
          enabled: false
        disarm:
          enabled: false
      tilt_error_disarm:
        enabled: false
      yaw_error_eland:
        enabled: false

    # eland_threshold: position error w.r.t. the tracker reference [m]; RLGoto does not follow the tracker, but its
    # goals stay within random_goto's box around the hover point where the tracker reference was left
    ActuatorsController:
      address: "srt_controller::ActuatorsController"
      namespace: "actuators_controller"
      eland_threshold: 0.0 # [m]
      failsafe_threshold: 0.0 # [m]
      odometry_innovation_threshold: 0.0 # [m]
      human_switchable: true

      outputs:
        actuators:             true
        control_group:         false
        attitude_rate:         false
        attitude:              false
        acceleration_hdg_rate: false
        acceleration_hdg:      false
        velocity_hdg_rate:     false
        velocity_hdg:          false
        position:              false

    RLGoto:
      address: "rl_goto_controller::RLGoto"
      namespace: "rl_goto"
      eland_threshold: 0.0 # [m]
      failsafe_threshold: 0.0 # [m]
      odometry_innovation_threshold: 0.0 # [m]
      human_switchable: true

      outputs:
        actuators:             true
        control_group:         false
        attitude_rate:         false
        attitude:              false
        acceleration_hdg_rate: false
        acceleration_hdg:      false
        velocity_hdg_rate:     false
        velocity_hdg:          false
        position:              false

    controllers : [
      "ActuatorsController",
      "RLGoto"
    ]

  uav_manager:

    takeoff:

      # must lie inside the vertical safety area of world_$WORLD_NAME.yaml
      takeoff_height: 2.5

      during_takeoff:
        controller: "MpcController"
        tracker: "LandoffTracker"

      # safe hover after takeoff; then switch manually (windows Actuators -> RLGoto of tmux.sh)
      after_takeoff:
        controller: "MpcController"
        tracker: "MpcTracker"

# ActuatorsController gains for the m430 (uav58), softer than the package defaults tuned on the a300 in simulation:
# on 2026-10-07 the attitude loop oscillated at ~3-4 Hz (pitch first) and diverged within 2 s.
# Tune live during flight: find the names with  ros2 param list /uav58/control_manager | grep gains/  and set with
#   ros2 param set /uav58/control_manager <name> <value>
mrs_uav_controllers:

  actuators_controller:

    gains:

      position: 5.0
      velocity: 3.0
      attitude: 4.0      # [rad/s per rad]
      attitude_rate: 1.0 # multiplied by the inertia

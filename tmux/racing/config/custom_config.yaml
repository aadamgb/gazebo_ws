# GET ALL PARAMETERS USABLE FOR CUSTOM CONFIG BY RUNNING:
## --------------------------------------------------------------
## |          rosrun mrs_uav_core get_public_params.py          #
## --------------------------------------------------------------

mrs_uav_managers:

  estimation_manager:

    # loaded state estimator plugins
    state_estimators: [
      "gps_baro",
      "ground_truth",
    ]

    # the policy's observation and the gate positions in the track yaml are both in
    # the gazebo world frame; ground truth gives exactly that (needs --enable-ground-truth
    # on the spawn call)
    initial_state_estimator: "ground_truth" # will be used as the first state estimator
    # initial_state_estimator: "gps_baro" # will be used as the first state estimator
    agl_height_estimator: "" # only slightly filtered height for checking min height (not used in control feedback)

  control_manager:

    # racing flies far outside the default envelope, and VelocityController ignores the
    # tracker: the tracker's position/heading stay frozen at the takeoff hover point while
    # the policy flies the track, so the default checks would eland mid-lap
    safety:
      tilt_limit:
        eland:
          enabled: false
        disarm:
          enabled: false
      tilt_error_disarm:
        enabled: false
      yaw_error_eland:
        enabled: false

    ActuatorsController:
      address: "srt_controller::ActuatorsController"
      namespace: "actuators_controller"
      eland_threshold: 3.0 # [m], position error triggering eland
      failsafe_threshold: 5.0 # [m], position error triggering failsafe land
      odometry_innovation_threshold: 1.5 # [m], position odometry innovation threshold
      human_switchable: true

      # PX4 accepts only attitude / attitude_rate -- see mrs_uav_px4_api/config/px4_api.yaml
      outputs:
        actuators:             false
        control_group:         false
        attitude_rate:         false
        attitude:              true
        acceleration_hdg_rate: false
        acceleration_hdg:      false
        velocity_hdg_rate:     false
        velocity_hdg:          false
        position:              false

    VelocityController:
      address: "lvhr_controller::VelocityController"
      namespace: "velocity_controller"
      eland_threshold: 0.0 # [m], position error triggering eland
      failsafe_threshold: 0.0 # [m], position error triggering failsafe land
      odometry_innovation_threshold: 0.0 # [m], position odometry innovation threshold
      human_switchable: true

      # emits HwApiAttitudeRateCmd (collective thrust + body rates)
      outputs:
        actuators:             false
        control_group:         false
        attitude_rate:         true
        attitude:              false
        acceleration_hdg_rate: false
        acceleration_hdg:      false
        velocity_hdg_rate:     false
        velocity_hdg:          false
        position:              false

    # every name here needs a matching parameter block above, otherwise
    # control_manager cannot resolve its address and silently drops it
    controllers : [
      "ActuatorsController",
      "VelocityController",
    ]

  uav_manager:

    # racing throttle regularly exceeds the default 0.8 limit
    max_throttle:
      enabled: false

    takeoff:

      # gate height of the fig8 track
      takeoff_height: 1.5

      during_takeoff:
        controller: "MpcController"
        tracker: "LandoffTracker"

      after_takeoff:
        controller: "VelocityController"
        tracker: "MpcTracker"

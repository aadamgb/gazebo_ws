# HITL split, LAPTOP side: Gazebo + PX4 SITL + mavros (started by the spawner), goals, rviz
# the MRS core with the controllers runs on the drone (session_drone.yaml)
# do not modify these
root: ./
name: hitl
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
pre_window:
  - export UAV_NAME=uav1
  - export RUN_TYPE=simulation
  - export UAV_TYPE=x500
  - export GZ_SIM_RESOURCE_PATH=`ros2 pkg prefix alien_gazebo_resources`/share/alien_gazebo_resources/models:$GZ_SIM_RESOURCE_PATH
  - export USE_SIM_TIME="true"
  - export QT_QUICK_CONTROLS_STYLE=Material # Gazebo dark mode
  # must match session_drone.yaml; DDS only on the ethernet link to the drone
  - export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
  - export ROS_DOMAIN_ID=42
  - export CYCLONEDDS_URI='<CycloneDDS><Domain><General><Interfaces><NetworkInterface name="enp12s0"/></Interfaces></General></Domain></CycloneDDS>'
startup_window: gazebo
windows:
  - gazebo:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_gazebo_simulator simulation.launch.py
          world_file:=`ros2 pkg prefix alien_gazebo_resources`/share/alien_gazebo_resources/worlds/checkerboard.sdf
          spawner_config:=../position_control/config/spawner_config.yaml
          gz_headless:=false gz_verbose:=true
        - |
          waitForGazebo; sleep 5; ros2 service call /mrs_drone_spawner/spawn mrs_msgs/srv/String "{value: '1 --${UAV_TYPE}_alien --enable-rangefinder --enable-ground-truth --pos 0 0 0.25 0.0'}"
  - random_goto:
      layout: tiled
      panes:
        # not started automatically: RLGoto flies to the goals as soon as it is active,
        # start it (arrow-up + enter) only once RLGoto hovers fine; random_goto.py keeps the goals inside the box
        - print -s "../position_control/random_goto.py"
  - rviz:
      layout: tiled
      panes:
        - waitForCore; ros2 run rviz2 rviz2 -d ../position_control/rviz.rviz --ros-args -p use_sim_time:=true
